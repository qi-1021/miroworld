name: "💡 功能建议"
description: "提出一个新功能或改进点"
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > 提交前请确认：本项目遵循 **“不替用户做决策”**（见 docs/DEVELOPMENT.md §5）—— 我们做“看得见、比得上、选得快”的工具，不做“替你选最好”的自动化。建议尽量描述“帮你看清”的方案。

  - type: dropdown
    id: module
    attributes:
      label: "相关模块"
      options:
        - "世界设定库"
        - "时间线"
        - "知识图谱"
        - "世界模拟/分叉"
        - "模型设置"
        - "前端/交互"
        - "CLI / API"
        - "安装/部署/脚本"
        - "文档"
        - "其他"
      default: 0
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "动机 / 场景"
      description: "你在什么场景下需要它？现在怎么做的、哪里不顺？"
      placeholder: |
        例如：我在写多线并行时，需要同时看两条时间线的差异，现在只能来回切换...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案"
      description: "你希望怎么实现？交互大概长什么样？"
      placeholder: |
        例如：在时间线顶部加“对比模式”，并排高亮差异事件...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案"
      description: "有没有其他也能接受的做法？"
      render: markdown
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "补充信息"
      render: markdown
    validations:
      required: false
