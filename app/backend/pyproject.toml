[project]
name = "miroworld-backend"
version = "0.1.0"
description = "Miroworld - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Miroworld Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# Graphiti 本地后端（替代 Zep Cloud）
# 安装: uv sync --extra graphiti
# 启用: ZEP_BACKEND=graphiti
# 注意: 与 oasis 依赖冲突 (neo4j 版本不兼容)
graphiti = [
    "zep-cloud==3.13.0",
    "graphiti-core>=0.25.0,<0.26.0",
]

# 本地向量模型运行时（体积较大，按需安装）
# 安装: uv pip install sentence-transformers
# 用法: 把标准 HF/Sentence Transformers 模型目录放入 app/models/embeddings/
local-embeddings = [
    "sentence-transformers>=2.7.0",
]

# OASIS 社交媒体模拟（与 graphiti 依赖冲突）
# 安装: uv sync --extra oasis
# 注意: 与 graphiti 依赖冲突 (neo4j 版本不兼容)
# 如需启用 oasis，请将下方注释取消，并注释掉 graphiti 部分
oasis = [
    "zep-cloud==3.13.0",
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
